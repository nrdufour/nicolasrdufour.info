name: ci

# Runs on pull_request as well as push to main: gates that only run after the
# merge are not gates. The toolchain comes from the flake, so this workflow
# never names a version; `just check` is the single definition of what passes.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: native
    env:
      # The native runner's HOME is not writable, so every cache a tool reaches
      # for is redirected into the workspace. XDG_CACHE_HOME covers nix's own
      # eval cache and anything using os.UserCacheDir(); language-specific
      # caches are added below per kind.
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check
        run: nix develop --command just check

      # Some tools create their caches read-only (Go's module cache does), which
      # leaves the runner unable to delete the workspace at teardown. Hand write
      # permission back so it can.
      - name: Make caches removable
        if: always()
        shell: bash
        run: chmod -R u+w .cache 2>/dev/null || true

  style:
    # The gate that applies to every file, prose included. No paths filter on
    # purpose: Markdown is where a smart quote is most likely to arrive. Cheap
    # - checkout and grep, no toolchain.
    runs-on: native
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Characters that render like ASCII, or render as nothing at all, but
      # compare unequal. Visually distinct symbols are fine and deliberately
      # allowed: degrees, arrows, >=, UI glyphs.
      - name: Confusable characters
        shell: bash
        run: |
          pattern='[\x{2010}-\x{2015}\x{2212}\x{2018}\x{2019}\x{201A}\x{201C}\x{201D}\x{201E}\x{2032}\x{2033}\x{00B7}\x{2026}\x{00D7}\x{00A0}\x{200B}-\x{200D}\x{2060}\x{FEFF}]'
          if hits=$(git ls-files | xargs grep -nIP "$pattern" 2>/dev/null); then
            echo "characters confusable with ASCII, or invisible:"
            echo "$hits"
            echo
            echo "Use - . ... x and a plain space instead."
            exit 1
          fi
