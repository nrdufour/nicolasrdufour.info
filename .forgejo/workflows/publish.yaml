# Publish the site to nemosites, the public web host on Hetzner Cloud.
#
# This workflow deliberately contains no deployment logic: it checks out the
# repo and calls `just publish`, the same recipe run by hand on calypso. One
# mechanism, two triggers — so a publish from a laptop and a publish from CI
# cannot drift apart.
#
# runs-on: native is required. The publish key is a sops secret rendered onto
# the runner host at /run/secrets/nicolasrdufour/publish_ssh_key, readable by
# the runner's DynamicUser through the nicolasrdufour-publish group (wired up
# in avalanche: nixos/hosts/hawk/forgejo/forgejo-runner.nix). A container job
# cannot see that path.
#
# Until the web host exists and the DNS records point at it, this fails to
# connect — expected for the few hours between this PR and the cutover, and
# red on main is the honest sign that the publish target isn't live yet.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Two overlapping rsyncs into the same web root would interleave. Never
  # cancel one in flight: a half-applied --delete is a broken site.
  group: publish-nicolasrdufour
  cancel-in-progress: false

jobs:
  publish:
    runs-on: native
    steps:
      - uses: actions/checkout@v7

      - name: Build and publish
        run: nix develop --command just publish
